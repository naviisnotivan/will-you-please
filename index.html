<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine? 💗</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: pink;
    transition: background 0.5s ease;
}

.container {
    position: relative;
    width: 90%;
    max-width: 400px;
    padding: 20px;
    text-align: center;
    background: #fff0f5;
    border-radius: 18px;
    box-shadow: 0 5px 20px #ff69b455;
    transition: 0.5s ease;
    z-index: 2;
}

h2 {
    font-size: 17px;
    margin: 0 0 8px;
    color: #d63384;
}

h1 {
    font-size: 25px;
    margin: 8px 0 14px;
    color: #ff1493;
}

p {
    font-size: 13px;
    margin: 8px 0 12px;
}

.photo {
    width: 100%;
    max-width: 230px;
    height: 125px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 12px;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

button {
    padding: 10px 20px;
    font-size: 14px;
    font-weight: bold;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    transition: 0.25s ease;
}

#yesBtn {
    background: #ff69b4;
    color: white;
}

#noBtn {
    background: white;
    color: #d63384;
    border: 1px solid #ff69b4;
}

button:hover {
    transform: scale(1.06);
}

#message {
    min-height: 18px;
    font-size: 13px;
    font-weight: bold;
    margin-top: 12px;
    color: #d63384;
}

.flower {
    position: fixed;
    font-size: 25px;
    pointer-events: none;
    z-index: 1;
    transition: 0.5s ease;
    animation: float 3s ease-in-out infinite alternate;
}

@keyframes float {
    from { transform: translateY(-4px) rotate(-8deg); }
    to { transform: translateY(5px) rotate(8deg); }
}

body.no-mode {
    background: #65001f;
}

body.no-mode .container {
    background: #350010;
    box-shadow: 0 0 25px #ff1744;
}

body.no-mode h1,
body.no-mode h2,
body.no-mode p,
body.no-mode #message {
    color: #ffd6e2;
}

body.no-mode .flower {
    filter: grayscale(1) brightness(0.6);
    opacity: 0.5;
    transform: rotate(60deg);
}

body.yes-mode {
    background: #ffb6d5;
}

body.yes-mode .container {
    box-shadow: 0 0 30px #ff1493;
}

body.yes-mode .flower {
    filter: drop-shadow(0 0 8px #ff69b4);
    transform: scale(1.2);
}

@media (max-height: 600px) {
    .container {
        padding: 12px;
        max-width: 360px;
    }

    h1 {
        font-size: 21px;
        margin: 5px 0 8px;
    }

    .photo {
        height: 85px;
        max-width: 190px;
        margin-bottom: 8px;
    }

    p {
        margin: 5px 0 8px;
    }

    #message {
        margin-top: 7px;
    }

    .flower {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h2>I have something to tell you? 💌</h2>
    <h1>Will you be my Valentine? 💗</h1>

    <p>There's something I've been meaning to ask you...</p>

    <img src="photo.jpg" alt="Our special photo" class="photo">

    <div class="buttons">
        <button id="yesBtn" onclick="sayYes()">Yes 💖</button>
        <button id="noBtn" onclick="sayNo()">No 🙈</button>
    </div>

    <div id="message"></div>
</div>

<script>
const flowerEmojis = ["🌹", "🌼", "🌸", "🌷", "💐", "🌺"];

for (let i = 0; i < 36; i++) {
    const flower = document.createElement("div");
    flower.className = "flower";
    flower.textContent = flowerEmojis[i % flowerEmojis.length];

    flower.style.left = Math.random() * 96 + "%";
    flower.style.top = Math.random() * 94 + "%";
    flower.style.animationDelay = Math.random() * 3 + "s";

    document.body.appendChild(flower);
}

const noMessages = [
    "Are you sure? 🥺",
    "Please reconsider... 🌹",
    "I'll give you all the flowers! 🌷",
    "You're breaking my little heart! 😭",
    "Okay, okay... you get another YES! 💗"
];

let noClicks = 0;

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const message = document.getElementById("message");

noBtn.addEventListener("mouseenter", () => {
    document.body.classList.add("no-mode");
});

noBtn.addEventListener("mouseleave", () => {
    document.body.classList.remove("no-mode");
});

yesBtn.addEventListener("mouseenter", () => {
    document.body.classList.add("yes-mode");
});

yesBtn.addEventListener("mouseleave", () => {
    document.body.classList.remove("yes-mode");
});

function sayNo() {
    noClicks++;

    document.body.classList.add("no-mode");
    message.textContent = noMessages[Math.min(noClicks - 1, 4)];

    if (noClicks >= 5) {
        noBtn.textContent = "Yes 💖";
        noBtn.onclick = sayYes;
        noBtn.onmouseenter = null;
        noBtn.onmouseleave = null;

        noBtn.style.background = "#ff69b4";
        noBtn.style.color = "white";
        noBtn.style.border = "none";

        message.textContent = "Now you have TWO Yes buttons! 💕";
    } else {
        noBtn.style.position = "relative";
        noBtn.style.left = (Math.random() * 20 - 10) + "px";
        noBtn.style.top = (Math.random() * 12 - 6) + "px";
    }
}

function sayYes() {
    document.body.classList.remove("no-mode");
    document.body.classList.add("yes-mode");

    document.querySelectorAll(".flower").forEach(flower => {
        flower.style.filter = "drop-shadow(0 0 8px #ff69b4)";
    });

    message.textContent = "YAY!! You made me so happy! 💗🌹🌼";
    yesBtn.textContent = "YAY!! 💞";

    if (noClicks >= 5) {
        noBtn.textContent = "YESSS! 💖";
    }
}
</script>

</body>
</html>
