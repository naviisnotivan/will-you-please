<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine? 💗</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: pink;
    transition: background .45s ease;
}

.container {
    position: relative;
    z-index: 2;
    width: min(92%, 390px);
    max-height: calc(100vh - 20px);
    overflow-y: auto;
    padding: 17px 18px;
    text-align: center;
    background: #fff0f5;
    border-radius: 20px;
    box-shadow: 0 5px 22px #ff69b455;
    transition: background .45s ease, box-shadow .45s ease;
}

h2 {
    font-size: 16px;
    margin: 0 0 7px;
    color: #d63384;
}

h1 {
    font-size: clamp(22px, 6vw, 27px);
    line-height: 1.15;
    margin: 6px 0 9px;
    color: #ff1493;
}

p {
    font-size: 13px;
    line-height: 1.35;
    margin: 7px 0 10px;
}

/* Larger photo */
.photo {
    display: block;
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 13px;
    margin: 0 auto 13px;
    box-shadow: 0 3px 12px #ff69b433;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    min-height: 43px;
}

button {
    padding: 10px 19px;
    min-width: 95px;
    font-size: 14px;
    font-weight: bold;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    transition: transform .2s ease, background .3s ease, box-shadow .3s ease;
}

#yesBtn {
    color: white;
    background: #ff69b4;
    box-shadow: 0 4px 10px #ff69b455;
}

#noBtn {
    color: #d63384;
    background: white;
    border: 1px solid #ff69b4;
}

button:hover {
    transform: scale(1.06);
}

#message {
    min-height: 18px;
    margin: 10px 0 0;
    font-size: 13px;
    font-weight: bold;
    color: #d63384;
}

/* Decorative flowers */
.flower {
    position: fixed;
    font-size: 24px;
    pointer-events: none;
    user-select: none;
    z-index: 1;
    transition: filter .45s ease, opacity .45s ease, transform .45s ease;
    animation: float 3s ease-in-out infinite alternate;
}

@keyframes float {
    from { translate: 0 -4px; rotate: -8deg; }
    to { translate: 0 5px; rotate: 8deg; }
}

/* No hover: dark red and wilted flowers */
body.no-mode {
    background: #65001f;
}

body.no-mode .container {
    background: #350010;
    box-shadow: 0 0 25px #ff1744aa;
}

body.no-mode h1,
body.no-mode h2,
body.no-mode p,
body.no-mode #message {
    color: #ffd6e2;
}

body.no-mode .flower {
    filter: grayscale(1) brightness(.6);
    opacity: .48;
    transform: rotate(55deg) scale(.85);
}

/* Yes hover: bright and blooming */
body.yes-mode {
    background: #ffb6d5;
}

body.yes-mode .container {
    box-shadow: 0 0 30px #ff1493aa;
}

body.yes-mode .flower {
    filter: drop-shadow(0 0 8px #ff69b4);
    opacity: 1;
    transform: scale(1.18);
}

/* Keep the page compact on shorter screens */
@media (max-height: 680px) {
    .container {
        width: min(92%, 370px);
        padding: 12px 15px;
    }

    h1 {
        font-size: 21px;
        margin: 5px 0 7px;
    }

    .photo {
        height: 125px;
        margin-bottom: 9px;
    }

    p {
        margin: 5px 0 8px;
    }

    #message {
        margin-top: 7px;
    }

    .flower {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<main class="container">
    <h2>I have something to tell you... 💌</h2>
    <h1>Will you be my Valentine? 💗</h1>
    <p>There's something I've been meaning to ask you...</p>

    <img src="photo.jpg" alt="Our special photo" class="photo" id="photo">

    <div class="buttons" id="buttons">
        <button id="yesBtn" type="button">Yes 💖</button>
        <button id="noBtn" type="button">No 🙈</button>
    </div>

    <div id="message" aria-live="polite"></div>
</main>
